version: '3.4'

services:
  despesas-frontend-react:
    container_name: proto
    image: alexfariakof/despesas-pessoais-frontend-react-prototipo-img
    build:
      context: .
      dockerfile: ./Dockerfile.Prototipo
    environment:
      NODE_ENV: production
    ports:
      - 3001:80
      - 443:443
    volumes:
        - ./certificate/ssl_certificate.crt:/etc/nginx/certificate/ssl_certificate.crt
        - ./certificate/ssl_certificate.key:/etc/nginx/certificate/ssl_certificate.key
